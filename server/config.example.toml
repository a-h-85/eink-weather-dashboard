# Copy to config.toml and adjust.

[location]
# Just the name of your town. Coordinates and timezone are looked up once (Open-Meteo
# geocoding, no key) and cached. Not the right one? `python3 server.py --find "Springfield"`
place = "Berlin"
# country = "DE"              # optional ISO code if the name exists in several countries
# name = "Home"               # optional text for the footer (default: the place name)
# latitude = 52.52            # optional: give all three to skip the lookup
# longitude = 13.405
# timezone = "Europe/Berlin"

[weather]
# "dwd"       Deutscher Wetterdienst via Bright Sky: real station measurements + MOSMIX forecast
#             (Germany and its border regions only)
# "openmeteo" Open-Meteo weather models (worldwide) - use this outside Germany
# The other provider is used automatically if the preferred one is unreachable.
provider = "dwd"

[display]
language = "en"               # "en" or "de"
refresh_minutes = 30          # ESP32 wakes at every :00 / :30 (+20 s)

[server]
host = "0.0.0.0"
port = 8080

[battery]
# type = "nimh":   NiMH cells have a flat voltage curve, so the level is COUNTED: the ESP32
#                  reports its awake time, the server adds the sleep current. The voltage only
#                  guards the very end and detects fresh batteries (or use the button on the
#                  preview page). Set the capacity of your cells.
# type = "linear": the voltage maps linearly from empty_mv (0 %) to full_mv (100 %) -
#                  fine for Li-ion / LiPo (3300 / 4150) or 3x AA alkaline (3300 / 4650).
type = "nimh"
cells = 3
capacity_mah = 1900           # usable capacity of one cell (e.g. Eneloop 1900 mAh)
active_ma = 75                # average current while awake (WiFi + display refresh)
sleep_ua = 80                 # deep sleep: ESP32 + regulator quiescent current + divider
empty_mv = 3300
full_mv = 4150
